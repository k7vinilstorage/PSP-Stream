<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSPStream</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="brand">PSPStream <span id="version" class="muted"></span></div>
  <div id="conn" class="pill wait" data-i18n="connecting to the server">connecting to the server</div>
</header>

<main>
  <section class="card" aria-labelledby="now-title">
    <h2 id="now-title" data-i18n="Now">Now</h2>
    <div class="tiles" id="tiles">
      <div class="tile"><span class="num" id="t-fps">–</span><span class="cap" data-i18n="fps on the PSP">fps on the PSP</span></div>
      <div class="tile"><span class="num" id="t-src">–</span><span class="cap" data-i18n="capture fps">capture fps</span></div>
      <div class="tile"><span class="num" id="t-lat">–</span><span class="cap" data-i18n="latency (ms)">latency (ms)</span></div>
      <div class="tile"><span class="num" id="t-wifi">–</span><span class="cap">Wi-Fi (KB/s)</span></div>
      <div class="tile"><span class="num" id="t-hitch">–</span><span class="cap" data-i18n="hitches">hitches</span></div>
      <div class="tile"><span class="num" id="t-q">–</span><span class="cap" data-i18n="quality">quality</span></div>
    </div>
    <dl class="facts" id="facts"></dl>
  </section>

  <form id="form" novalidate></form>

  <section class="card" aria-labelledby="log-title">
    <h2 id="log-title">Log</h2>
    <pre id="log" tabindex="0" aria-label="Server log" data-i18n-aria-label="Server log"></pre>
  </section>

  <p class="foot muted" id="foot"></p>
</main>

<div class="bar" id="bar" hidden>
  <span id="bar-msg" data-i18n="Changes not applied yet">Changes not applied yet</span>
  <span class="grow"></span>
  <button type="button" id="undo" class="ghost" data-i18n="Undo">Undo</button>
  <button type="button" id="apply" class="primary" data-i18n="Apply">Apply</button>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="/app.js"></script>
</body>
</html>
