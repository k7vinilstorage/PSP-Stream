# Compila o EBOOT do PSP, roda os testes e gera os pacotes .deb (Ubuntu 22.04+,
# Debian 12+) e .rpm (Fedora) e o servidor de Windows (zip com o pspstream.exe
# e o GStreamer reduzido) a cada push e pull request. A imagem Docker
# (Dockerfile, para usar ao lado do Wolf) é compilada e testada contra o Wolf
# falso; num push na main ela vai para ghcr.io/<dono>/pspstream:nightly, e
# numa tag v1.2, para :1.2 e :latest.
#
# Downloads (Releases do GitHub):
#   - push na main: a pré-release "nightly" é refeita com o EBOOT e os pacotes
#     do commit (.../releases/download/nightly/PSPStream-EBOOT.zip);
#   - tag v*: release estável, com as notas da seção do CHANGELOG.md
#     (git tag v1.2 && git push origin v1.2).
# Em qualquer outro push, os arquivos ficam nos "artifacts" da execução.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eboot:
    name: EBOOT (PSP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: pspdev
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential cmake pkgconf libreadline8 libusb-0.1-4 libgpgme11 \
            libarchive-tools fakeroot
          curl -fsSL -o pspdev.tar.gz \
            https://github.com/pspdev/pspdev/releases/latest/download/pspdev-ubuntu-latest-x86_64.tar.gz
          tar xzf pspdev.tar.gz -C "$HOME"
          rm pspdev.tar.gz
      - name: build
        run: make -C psp dist
      - uses: actions/upload-artifact@v4
        with:
          name: PSPStream-EBOOT
          path: psp/dist/
          if-no-files-found: error

  tests:
    name: server tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-gi gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-gl \
            gstreamer1.0-pipewire libopenh264-dev python3-evdev python3-pil gcc make pkg-config libdrm-dev
      - name: tests
        run: /usr/bin/python3 -m unittest discover -v tests
      - name: ruff
        run: pipx run ruff==0.16.10 check server tools tests  # regras em ruff.toml

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write  # publicar no ghcr.io (só num push na main ou numa tag)
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: docker build -t pspstream:test .
      - name: test against the fake Wolf
        run: sh packaging/docker-test.sh pspstream:test
      - name: check the docker/ files and the installer
        run: sh packaging/compose-check.sh
      - name: publish to ghcr.io
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/pspstream"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags="${GITHUB_REF_NAME#v} latest"
          else
            tags="nightly sha-${GITHUB_SHA::7}"
          fi
          for tag in $tags; do
            docker tag pspstream:test "$image:$tag"
            docker push "$image:$tag"
          done

  deb:
    name: .deb package
    # o 22.04: a glibc do auxiliar KMS serve do 22.04 em diante
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # a versão sai da tag (packaging/version.sh)
      - name: build
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc make pkg-config libdrm-dev
          sh packaging/build-deb.sh
      - name: install and test
        run: |
          sudo apt-get install -y -q ./dist/*.deb
          sh packaging/smoke-test.sh jpeg
          sh packaging/smoke-test.sh h264p
      - uses: actions/upload-artifact@v4
        with:
          name: pspstream-deb
          path: dist/*.deb
          if-no-files-found: error

  rpm:
    name: .rpm package
    runs-on: ubuntu-24.04
    container: fedora:43
    steps:
      - name: tools
        run: dnf -y -q install git rpm-build gcc make libdrm-devel tar gzip
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sh packaging/build-rpm.sh
      - name: install and test
        run: |
          dnf -y -q install ./dist/*.rpm
          sh packaging/smoke-test.sh jpeg
      - uses: actions/upload-artifact@v4
        with:
          name: pspstream-rpm
          path: dist/*.rpm
          if-no-files-found: error

  windows:
    name: Windows server
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: GStreamer runtime
        shell: pwsh
        run: |
          # o runtime oficial (MSVC 64 bits) pelas wheels do PyPI, com os hashes de
          # packaging/windows/gstreamer-wheels.txt; daqui vão só os plugins que o servidor usa
          python packaging/windows/gstreamer.py "$env:RUNNER_TEMP\gst"
          "GST_ROOT=$env:RUNNER_TEMP\gst" >> $env:GITHUB_ENV
          & "$env:RUNNER_TEMP\gst\bin\gst-launch-1.0.exe" --version
      - name: dependencies
        run: python -m pip install pyinstaller pillow pefile truststore
      - name: ViGEmClient (virtual Xbox controller)
        # compilada do código-fonte oficial num commit fixo (packaging/windows/vigem.py)
        run: python packaging/windows/vigem.py "${{ runner.temp }}\vigem"
      - name: tests
        env:
          PSPSTREAM_GSTREAMER: ${{ env.GST_ROOT }}
          PSPSTREAM_VIGEMCLIENT: ${{ runner.temp }}\vigem\ViGEmClient.dll
        run: python -m unittest -v tests.test_windows tests.test_docs
      - name: build
        run: python packaging/windows/build.py --gstreamer "${{ env.GST_ROOT }}" --vigem "${{ runner.temp }}\vigem" --out dist
      - name: test the build
        run: python packaging/windows/smoke.py dist/PSPStream
      - name: installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          python packaging/windows/installer.py
      - name: test the installer
        # instala calado em Arquivos de Programas (caminho com espaço, como num PC), roda o smoke test no
        # que foi instalado, confere a regra do firewall e desinstala
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\setup.log"
          $p = Start-Process dist\PSPStream-Setup-x64.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=firewall", "/LOG=`"$log`"" -Wait -PassThru
          if ($p.ExitCode) { Get-Content $log -Tail 60; exit $p.ExitCode }
          $app = "$env:ProgramFiles\PSPStream"
          Get-ChildItem $app | Select-Object -ExpandProperty Name
          python packaging/windows/smoke.py $app
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          netsh advfirewall firewall show rule name=PSPStream
          if ($LASTEXITCODE) { throw "no firewall rule after installing" }
          $p = Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          "uninstall exit code: $($p.ExitCode)"
          netsh advfirewall firewall show rule name=PSPStream | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "the firewall rule is still there after uninstalling" }
          if (Test-Path "$app\pspstream.exe") { throw "pspstream.exe is still there after uninstalling" }
          "installed, tested and uninstalled"
          exit 0
      - name: screen capture on the runner (informational)
        continue-on-error: true
        run: python packaging/windows/smoke.py dist/PSPStream --screen
      - name: ViGEmBus installer (what --setup downloads)
        # o download do --setup: versão e SHA-256 fixos, e a assinatura do Nefarius. Instalar não dá: o
        # MSI do ViGEmBus recusa o Windows Server (a LaunchCondition), que é o sistema dos runners; o
        # controle de ponta a ponta é testado num Windows 10/11 pelo pspstream --check (win_gamepad.self_test)
        shell: pwsh
        run: |
          $setup = python -c "import sys; sys.path.insert(0, 'server'); import win_doctor; from pathlib import Path; print(win_doctor.download_vigembus(Path(sys.argv[1])))" "$env:RUNNER_TEMP\vigembus"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $sig = Get-AuthenticodeSignature $setup
          "$setup`nsignature: $($sig.Status), $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "Nefarius") { throw "unexpected signature" }
      - uses: actions/upload-artifact@v4
        with:
          name: pspstream-windows
          path: |
            dist/PSPStream-Windows-x64.zip
            dist/PSPStream-Setup-x64.exe
          if-no-files-found: error

  release:
    name: publish
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs: [eboot, tests, deb, rpm, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: files
        run: |
          mkdir -p out
          (cd artifacts/PSPStream-EBOOT && zip -qr ../../out/PSPStream-EBOOT.zip PSP)
          cp artifacts/pspstream-deb/*.deb artifacts/pspstream-rpm/*.rpm artifacts/pspstream-windows/*.zip artifacts/pspstream-windows/*.exe out/
          ls -l out
      - name: stable release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          sh packaging/release-notes.sh "${tag#v}" > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber
          else
            gh release create "$tag" out/* --title "PSPStream ${tag#v}" --notes-file notes.md
          fi
      - name: nightly (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag > /dev/null 2>&1 || true
          cat > notes.md <<NOTES
          Development build, remade on every push to main (commit ${GITHUB_SHA::7}).
          For the latest stable version, see the most recent release that is not a pre-release.

          - **PSPStream-EBOOT.zip**: copy the PSP folder to the root of the memory stick.
          - **.deb** (Ubuntu 22.04+, Debian 12+): \`sudo apt install ./pspstream_*.deb\`
          - **.rpm** (Fedora): \`sudo dnf install ./pspstream-*.rpm\`
          - **PSPStream-Setup-x64.exe** (Windows 10/11, experimental): the installer (firewall, Xbox controller driver, Start menu)
          - **PSPStream-Windows-x64.zip**: the same, portable: unzip and run \`pspstream.exe\`
          NOTES
          gh release create nightly out/* --prerelease --target "$GITHUB_SHA" \
            --title "Development (main, ${GITHUB_SHA::7})" --notes-file notes.md
