# Wolf (Games on Whales) + PSPStream on a clean install, with an Intel or AMD
# GPU (or no GPU). With NVIDIA, use compose.nvidia.yml. Already have Wolf? Use
# pspstream.yml. Step by step: https://github.com/k7vinilstorage/PSP-Stream/wiki/Wolf
# (or docker/install.sh).
#
#   cp .env.example .env    # and adjust
#   docker compose up -d
#
# The settings live in .env (or in the Portainer stack variables).

services:
  wolf:
    # As in the Wolf documentation (quickstart, Intel/AMD), plus the API socket
    # in /var/run/wolf for PSPStream (and Wolf UI, which looks for it there).
    image: ${WOLF_IMAGE:-ghcr.io/games-on-whales/wolf:stable}
    environment:
      - WOLF_SOCKET_PATH=/var/run/wolf/wolf.sock
    volumes:
      - /etc/wolf/:/etc/wolf
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /dev/:/dev/:rw
      - /run/udev:/run/udev:rw
      - /var/run/wolf:/var/run/wolf
    device_cgroup_rules:
      - 'c 13:* rmw'
    devices:
      - /dev/dri
      - /dev/uinput
      - /dev/uhid
    network_mode: host
    restart: unless-stopped

  pspstream:
    image: ${PSPSTREAM_IMAGE:-ghcr.io/k7vinilstorage/pspstream:nightly}
    depends_on:
      - wolf
    # The PSP talks to port 5123 on the server, and Wolf sends the image and
    # audio to 127.0.0.1: the host network, like Wolf.
    network_mode: host
    restart: unless-stopped
    # The Wolf socket belongs to root only (Wolf UI also runs as root). The uid
    # is 0, but with no capabilities, no privilege gain and read-only.
    user: "0:0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - /var/run/wolf:/var/run/wolf:ro
      - pspstream-config:/config
    environment:
      - WOLF_SOCKET_PATH=/var/run/wolf/wolf.sock
      - WOLF_VIDEO_PING_PORT=${WOLF_VIDEO_PING_PORT:-48100}
      - WOLF_AUDIO_PING_PORT=${WOLF_AUDIO_PING_PORT:-48200}
      - PSPSTREAM_VIDEO_CONVERT=${PSPSTREAM_VIDEO_CONVERT:-auto}
      - PSPSTREAM_WOLF_TARGET=${PSPSTREAM_WOLF_TARGET:-}
      - PSPSTREAM_WOLF_PIN=${PSPSTREAM_WOLF_PIN:-}
      - PSPSTREAM_PROFILE=${PSPSTREAM_PROFILE:-xbox}
      - PSPSTREAM_LANG=${PSPSTREAM_LANG:-en}
      - PSPSTREAM_WEB=${PSPSTREAM_WEB:-127.0.0.1:5124}
      - PSPSTREAM_WEB_PASSWORD=${PSPSTREAM_WEB_PASSWORD:-}
      - PSPSTREAM_WEB_HOSTS=${PSPSTREAM_WEB_HOSTS:-}
    command: ["--source", "wolf"]

volumes:
  pspstream-config:
