# Builds PSPStream from this repository instead of pulling the ready image
# from ghcr.io (a branch that has not reached main yet, or local changes).
# Together with one of the other files:
#
#   docker compose -f compose.yml -f build.yml up -d --build
#   docker compose -f pspstream.yml -f build.yml up -d --build

services:
  pspstream:
    image: pspstream:local
    build:
      context: ..
