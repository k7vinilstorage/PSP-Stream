# Compila o PSPStream a partir deste repositório, em vez de baixar a imagem
# pronta do ghcr.io (um branch que ainda não foi para a main, ou mudanças
# locais). Junto com um dos outros arquivos:
#
#   docker compose -f compose.yml -f build.yml up -d --build
#   docker compose -f pspstream.yml -f build.yml up -d --build

services:
  pspstream:
    image: pspstream:local
    build:
      context: ..
